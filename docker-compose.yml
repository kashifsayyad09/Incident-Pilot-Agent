services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"        # open http://localhost:8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Reachable only when the optional `decider` profile is running; otherwise the
      # API reports Decider 2B as unavailable (it never fakes a decision).
      INCIDENTPILOT_DECIDER_URL: http://decider:9000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    expose:
      - "3000"

  # Optional: `docker compose --profile decider up --build`
  decider:
    profiles: ["decider"]
    build: ./decider
    expose:
      - "9000"
    volumes:
      - hf-cache:/root/.cache/huggingface

volumes:
  hf-cache:
