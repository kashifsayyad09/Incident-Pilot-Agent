# Single entry point: browser -> nginx :80 -> frontend (/) or backend (API).
# The browser only ever talks to one origin, so no CORS and no frontend env vars.

# Only send "Connection: upgrade" for real websocket upgrade requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend_app { server frontend:3000; }
upstream backend_api  { server backend:8000; }

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Backend routes -------------------------------------------------
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # agent runs can take a while
    }

    location = /health {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    # Backend API docs
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    # --- Everything else -> Next.js ------------------------------------
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;     # Next.js dev HMR / websockets
        proxy_set_header Connection $connection_upgrade;
    }
}
